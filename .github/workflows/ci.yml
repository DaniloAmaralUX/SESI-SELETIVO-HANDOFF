name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# O app (Vite/React) vive em app/; todos os passos `run` operam lá.
defaults:
  run:
    working-directory: app

jobs:
  install-lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Sem `version`: a action lê o campo "packageManager" do app/package.json,
      # que é a fonte única da versão do pnpm (local e CI não divergem).
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint the code
        run: pnpm lint

      # Reativado após a limpeza de código morto (base zerada no knip)
      - name: Analyze unused files and dependencies
        run: pnpm knip

      - name: Run Prettier check
        run: pnpm format:check

      # Roda da raiz: verifica os .md do repositório inteiro, não só os de app/
      - name: Check documentation links
        working-directory: .
        run: node scripts/check-links.mjs

      - name: Install browsers
        run: pnpm test:browser:install

      - name: Run tests
        run: pnpm test

      - name: Build the project
        run: pnpm build
